services:
  - type: web
    name: roadsos-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: roadsos-redis
          property: connectionString

  - type: redis
    name: roadsos-redis
    ipAllowList: [] # Only allow internal connections
    plan: free # Use the free tier
